name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ["capacitor.config.ts", ".github/workflows/android-apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: bun install
      - run: bunx cap add android && bunx cap sync android
      - name: Health Connect permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.health.READ_STEPS" />\n    <queries><package android:name="com.google.android.apps.healthdata" /></queries>\n    <application#' $M
          sed -i 's#</activity>#  <intent-filter><action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE" /></intent-filter>\n        </activity>#' $M
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: summ-it Android
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
    permissions:
      contents: write
